# Actualiza las imágenes dinámicas del perfil una vez al día.
#
# - snake: animación de la actividad (gráfico de contribuciones), publicada en la rama `output`.
# - languages: tarjeta de lenguajes en assets/languages.svg. Solo se regenera si existe
#   el secreto LANGS_TOKEN (token personal de solo lectura), para incluir los repos
#   privados; sin él se conserva la tarjeta actual en vez de publicar una incompleta.
name: Actualizar perfil

on:
  schedule:
    - cron: '0 6 * * *' # 01:00 en Lima
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generar animación
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#f5b83d&color_dots=#ebedf0,#c7d2fe,#9fb3ff,#5b7cff,#2f52e0
            dist/github-snake-dark.svg?color_snake=#f5b83d&color_dots=#161b22,#172752,#2c3d6b,#5b7cff,#9fb3ff

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar tarjeta de lenguajes
        env:
          GH_TOKEN: ${{ secrets.LANGS_TOKEN }}
          LANGS_PRIVATE: 'true'
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Sin LANGS_TOKEN: se conserva la tarjeta actual."
            exit 0
          fi
          node scripts/languages.mjs assets/languages.svg

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/languages.svg
          git diff --cached --quiet || (git commit -m "Actualizar tarjeta de lenguajes" && git push)
